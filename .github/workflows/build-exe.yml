name: Gerar Moneta.exe

# Compila o executável do Windows e publica (ou atualiza) a release.
# Rode manualmente na aba Actions → "Gerar Moneta.exe" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install pywebview pyinstaller

      - name: Gera o executável
        run: pyinstaller --noconfirm --onefile --windowed --name Moneta --add-data "index.html;." app.py

      - name: Escreve as notas da release
        run: |
          @"
          ## Novidades

          - **Gastos fixos agora contam como essenciais** no gráfico Essencial × Não essencial
          - **Atualização automática** — a partir desta versão o app baixa sozinho a versão mais
            recente a cada abertura com internet; você nunca mais precisa baixar um novo ``.exe``

          ## Download

          Baixe o **Moneta.exe** abaixo e execute — não precisa instalar nada.
          Se você já usava uma versão anterior, basta substituir o arquivo antigo:
          **seus gastos são preservados** (ficam salvos em ``%APPDATA%\Moneta``).
          "@ | Out-File -FilePath notas.md -Encoding utf8

      - name: Publica na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Moneta.exe --clobber
          } else {
            gh release create $tag dist/Moneta.exe --latest --title "Moneta $tag" --notes-file notas.md
          }
