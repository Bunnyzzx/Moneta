<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneta — Controle de Gastos</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --card-2: #1f232d;
    --accent: #7c5cff;
    --accent-2: #00d4a6;
    --warn: #ffb648;
    --danger: #ff5c7a;
    --text: #eef0f6;
    --muted: #8b93a7;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #232046 0%, var(--bg) 55%);
    min-height: 100vh;
    color: var(--text);
    padding: 32px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-size: 1.9rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  header p { color: var(--muted); margin-top: 4px; font-size: 0.95rem; }

  .total-card {
    background: linear-gradient(135deg, #2a2353, #173a3a);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  @media (max-width: 480px) { .total-card { grid-template-columns: 1fr; gap: 18px; } }
  .total-card .stat { min-width: 0; }
  .total-card .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; }
  .total-card .value { font-size: 1.6rem; font-weight: 800; margin-top: 4px; }
  .total-card .saldo-row { display: flex; align-items: center; gap: 8px; }
  .total-card .saldo-row button {
    background: none; border: none; cursor: pointer; font-size: 0.95rem;
    color: var(--muted); padding: 4px 6px; border-radius: 8px;
    transition: background .15s;
  }
  .total-card .saldo-row button:hover { background: rgba(255,255,255,0.08); }
  .saldo-edit {
    margin-top: 6px;
    width: 140px;
    background: var(--card-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 700;
    outline: none;
  }
  #restante.positivo, #restante-total.positivo { color: var(--accent-2); }
  #restante.negativo, #restante-total.negativo { color: var(--danger); }
  .total-card .count { text-align: right; color: var(--muted); font-size: 0.9rem; }
  .total-card .count b { color: var(--text); font-size: 1.3rem; display: block; }

  form {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  form input[type=text] {
    background: var(--card-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  form input:focus { border-color: var(--accent); }
  #nome { flex: 2; min-width: 160px; }
  #valor { flex: 1; min-width: 110px; }
  .essencial-toggle {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 0.92rem;
    cursor: pointer; user-select: none;
    padding: 10px 12px;
    background: var(--card-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    transition: border-color .2s, color .2s;
  }
  .essencial-toggle input { accent-color: var(--warn); width: 16px; height: 16px; cursor: pointer; }
  .essencial-toggle:has(input:checked) { border-color: var(--warn); color: var(--warn); }
  .fixo-toggle input { accent-color: var(--accent-2); }
  .fixo-toggle:has(input:checked) { border-color: var(--accent-2); color: var(--accent-2); }

  .mes-seletor { margin-bottom: 20px; }
  .mes-btn {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 11px 18px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color .15s;
    width: 100%;
  }
  .mes-btn:hover { border-color: var(--accent); }
  .mes-btn .mes-sel { color: var(--accent-2); text-transform: capitalize; }
  .mes-btn .seta { margin-left: auto; color: var(--muted); transition: transform .2s; }
  .mes-btn .seta.aberto { transform: rotate(180deg); }
  .meses-painel[hidden] { display: none; }
  .meses-painel {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    animation: slideIn .2s ease both;
  }
  @media (max-width: 600px) { .meses-painel { grid-template-columns: repeat(3, 1fr); } }
  .meses-painel .ano-label {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .meses-painel button {
    background: var(--card-2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 9px 6px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-transform: capitalize;
    transition: all .15s;
  }
  .meses-painel button:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .meses-painel button.ativo {
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    border-color: transparent;
    color: white;
  }
  .badge.fixo-badge { background: rgba(0,212,166,0.15); color: var(--accent-2); }
  form button[type=submit] {
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    color: white;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  form button[type=submit]:hover { opacity: .9; transform: translateY(-1px); }
  form button[type=submit]:active { transform: scale(.97); }

  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) { .charts { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 18px;
  }
  .chart-card h2, .list-card h2 {
    font-size: 1rem; color: var(--muted); margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* gráfico de barras */
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row .bar-label {
    width: 90px; flex-shrink: 0; font-size: 0.85rem;
    text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-row .bar-track { flex: 1; background: var(--card-2); border-radius: 6px; height: 22px; overflow: hidden; }
  .bar-row .bar-fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    transition: width .5s ease;
    min-width: 2px;
  }
  .bar-row.essencial .bar-fill { background: linear-gradient(90deg, var(--warn), #ff8a5c); }
  .bar-row .bar-value { width: 80px; flex-shrink: 0; text-align: right; font-size: 0.82rem; color: var(--muted); }

  /* gráfico donut */
  .donut-wrap { display: flex; align-items: center; gap: 18px; justify-content: center; }
  .donut-wrap svg { flex-shrink: 0; }
  .donut-center-text { font-size: 0.65rem; fill: var(--muted); }
  .donut-center-num { font-size: 0.95rem; font-weight: 700; fill: var(--text); }
  .legend { display: flex; flex-direction: column; gap: 10px; font-size: 0.88rem; }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .legend .val { color: var(--muted); }

  .list-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 18px;
  }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; font-style: italic; }

  .gasto {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 10px;
    border-radius: 12px;
    transition: background .15s;
    animation: slideIn .25s ease both;
  }
  .gasto:hover { background: var(--card-2); }
  .gasto + .gasto { border-top: 1px solid rgba(255,255,255,0.05); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .gasto .icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.1rem;
    background: rgba(124,92,255,0.18);
    color: var(--accent);
    flex-shrink: 0;
  }
  .gasto.essencial .icon { background: rgba(255,182,72,0.15); color: var(--warn); }
  .gasto .info { flex: 1; min-width: 0; }
  .gasto .info .nome { font-weight: 600; text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    background: rgba(255,182,72,0.15); color: var(--warn);
    padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
  }
  .gasto .info .data { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .gasto .preco { font-weight: 700; color: var(--accent-2); white-space: nowrap; }
  .gasto .info.edicao { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .gasto .nome-input {
    flex: 1; min-width: 120px;
    background: var(--card-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    outline: none;
  }
  .check-edit {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.78rem; color: var(--warn); cursor: pointer; user-select: none;
  }
  .check-edit input { accent-color: var(--warn); cursor: pointer; }
  .check-edit.fixo { color: var(--accent-2); }
  .check-edit.fixo input { accent-color: var(--accent-2); }
  .gasto .preco-input {
    width: 100px;
    background: var(--card-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 8px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 700;
    outline: none;
    text-align: right;
  }
  .gasto .act {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1rem; padding: 6px 8px; border-radius: 8px;
    transition: color .15s, background .15s;
  }
  .gasto .edit:hover { color: var(--accent); background: rgba(124,92,255,0.12); }
  .gasto .del:hover { color: var(--danger); background: rgba(255,92,122,0.12); }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💸 Moneta</h1>
    <p>Controle seus gastos de forma simples</p>
  </header>

  <div class="total-card">
    <div class="stat">
      <div class="label">Disponível no mês</div>
      <div class="value saldo-row">
        <span id="saldo">—</span>
        <button id="editar-saldo" title="Definir valor disponível">✏️</button>
      </div>
      <input id="saldo-input" class="saldo-edit" type="text" inputmode="decimal" placeholder="R$ 0,00" hidden>
    </div>
    <div class="stat">
      <div class="label">Total gasto em <span id="mes-atual"></span></div>
      <div class="value" id="total">R$ 0,00</div>
    </div>
    <div class="stat">
      <div class="label">Ainda disponível</div>
      <div class="value" id="restante">—</div>
    </div>
    <div class="stat">
      <div class="label">Restante total</div>
      <div class="value" id="restante-total">—</div>
    </div>
  </div>

  <div class="mes-seletor">
    <button id="mes-btn" class="mes-btn">📅 Mês <span class="mes-sel" id="mes-sel"></span> <span class="seta" id="mes-seta">▾</span></button>
    <div class="meses-painel" id="meses-painel" hidden></div>
  </div>

  <form id="form">
    <input id="nome" type="text" placeholder="Com o que gastou?" required autocomplete="off">
    <input id="valor" type="text" inputmode="decimal" placeholder="Valor (R$)" required autocomplete="off">
    <label class="essencial-toggle">
      <input type="checkbox" id="essencial">
      Essencial
    </label>
    <label class="essencial-toggle fixo-toggle">
      <input type="checkbox" id="fixo">
      Fixo
    </label>
    <button type="submit">Adicionar</button>
  </form>

  <div class="charts">
    <div class="chart-card">
      <h2>Gastos do mês</h2>
      <div id="barras"></div>
    </div>
    <div class="chart-card">
      <h2>Essencial × Não essencial</h2>
      <div class="donut-wrap" id="donut"></div>
    </div>
  </div>

  <div class="list-card">
    <h2>Seus gastos</h2>
    <div id="lista"></div>
  </div>

</div>

<script>
  const form = document.getElementById('form');
  const nomeInput = document.getElementById('nome');
  const valorInput = document.getElementById('valor');
  const essencialInput = document.getElementById('essencial');
  const lista = document.getElementById('lista');
  const totalEl = document.getElementById('total');
  const barrasEl = document.getElementById('barras');
  const donutEl = document.getElementById('donut');

  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const fixoInput = document.getElementById('fixo');
  const mesBtn = document.getElementById('mes-btn');
  const mesSelEl = document.getElementById('mes-sel');
  const mesSetaEl = document.getElementById('mes-seta');
  const mesesPainel = document.getElementById('meses-painel');
  const mesAtualEl = document.getElementById('mes-atual');

  mesBtn.addEventListener('click', () => {
    mesesPainel.hidden = !mesesPainel.hidden;
    mesSetaEl.classList.toggle('aberto', !mesesPainel.hidden);
  });

  const hoje = new Date();
  // mês exibido (formato {mes, ano}); começa no mês atual
  let visao = { mes: hoje.getMonth(), ano: hoje.getFullYear() };

  let gastos = JSON.parse(localStorage.getItem('gastos') || '[]');
  // saldo disponível por mês, chave "ano-mes"
  let saldos = JSON.parse(localStorage.getItem('saldos') || '{}');
  // migra o saldo único antigo para o mês atual
  const saldoAntigo = parseFloat(localStorage.getItem('saldoAntigo') || localStorage.getItem('saldoDisponivel'));
  if (!isNaN(saldoAntigo)) {
    const k = hojeChave();
    if (!(k in saldos)) { saldos[k] = saldoAntigo; localStorage.setItem('saldos', JSON.stringify(saldos)); }
    localStorage.removeItem('saldoDisponivel');
  }
  function hojeChave() { return new Date().getFullYear() + '-' + new Date().getMonth(); }
  function chaveVisao() { return visao.ano + '-' + visao.mes; }
  let editandoId = null;

  const saldoEl = document.getElementById('saldo');
  const restanteEl = document.getElementById('restante');
  const saldoInput = document.getElementById('saldo-input');
  const editarSaldoBtn = document.getElementById('editar-saldo');

  editarSaldoBtn.addEventListener('click', () => {
    const atual = saldos[chaveVisao()];
    saldoInput.hidden = false;
    saldoEl.parentElement.style.display = 'none';
    saldoInput.value = atual !== undefined ? String(atual.toFixed(2)).replace('.', ',') : '';
    saldoInput.focus();
    saldoInput.select();
  });
  function confirmarSaldo() {
    const v = parseValor(saldoInput.value);
    if (v > 0) {
      saldos[chaveVisao()] = v;
    } else if (saldoInput.value.trim() === '' || v === 0) {
      // campo vazio ou 0 remove o saldo do mês
      delete saldos[chaveVisao()];
    }
    localStorage.setItem('saldos', JSON.stringify(saldos));
    saldoInput.hidden = true;
    saldoEl.parentElement.style.display = '';
    render();
  }
  saldoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmarSaldo();
    if (e.key === 'Escape') { saldoInput.hidden = true; saldoEl.parentElement.style.display = ''; }
  });
  saldoInput.addEventListener('blur', confirmarSaldo);

  const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  // aceita "60,50", "60.50", "R$ 60,50", "1.234,56"
  function parseValor(str) {
    let bruto = str.replace(/[^\d.,]/g, '');
    if (bruto.includes(',')) bruto = bruto.replace(/\./g, '').replace(',', '.');
    return parseFloat(bruto);
  }

  // gastos de um mês: fixos aparecem em todo mês a partir da criação;
  // os demais só no mês em que foram lançados
  function gastosDe(mes, ano) {
    const inicioMes = new Date(ano, mes, 1);
    return gastos.filter(g => {
      const d = new Date(g.data);
      if (g.fixo) {
        return new Date(d.getFullYear(), d.getMonth(), 1) <= inicioMes;
      }
      return d.getMonth() === mes && d.getFullYear() === ano;
    });
  }
  function gastosDoMes() { return gastosDe(visao.mes, visao.ano); }

  // soma das sobras (saldo − gastos) de todos os meses com saldo definido,
  // até o mês exibido
  function restanteTotal() {
    let soma = 0, temAlgum = false;
    const limite = new Date(visao.ano, visao.mes, 1);
    for (const chave in saldos) {
      const [ano, mes] = chave.split('-').map(Number);
      if (new Date(ano, mes, 1) > limite) continue;
      const total = gastosDe(mes, ano).reduce((s, g) => s + g.valor, 0);
      soma += saldos[chave] - total;
      temAlgum = true;
    }
    return temAlgum ? soma : null;
  }

  function renderTabs() {
    mesSelEl.textContent = MESES[visao.mes] + (visao.ano !== hoje.getFullYear() ? ' ' + visao.ano : '');
    // anos: do gasto mais antigo até o ano atual
    let anoInicio = hoje.getFullYear();
    gastos.forEach(g => {
      const a = new Date(g.data).getFullYear();
      if (a < anoInicio) anoInicio = a;
    });
    mesesPainel.innerHTML = '';
    for (let ano = anoInicio; ano <= hoje.getFullYear(); ano++) {
      if (anoInicio !== hoje.getFullYear()) {
        const label = document.createElement('div');
        label.className = 'ano-label';
        label.textContent = ano;
        mesesPainel.appendChild(label);
      }
      for (let mes = 0; mes < 12; mes++) {
        const btn = document.createElement('button');
        btn.textContent = MESES[mes];
        if (mes === visao.mes && ano === visao.ano) btn.classList.add('ativo');
        btn.addEventListener('click', () => {
          visao = { mes, ano };
          mesesPainel.hidden = true;
          mesSetaEl.classList.remove('aberto');
          render();
        });
        mesesPainel.appendChild(btn);
      }
    }
  }

  function renderBarras(doMes) {
    barrasEl.innerHTML = '';
    if (doMes.length === 0) {
      barrasEl.innerHTML = '<div class="empty">Sem dados ainda</div>';
      return;
    }
    const ordenados = [...doMes].sort((a, b) => b.valor - a.valor).slice(0, 6);
    const max = ordenados[0].valor;
    ordenados.forEach(g => {
      const row = document.createElement('div');
      row.className = 'bar-row' + (g.essencial ? ' essencial' : '');
      row.innerHTML = `
        <div class="bar-label" title="${g.nome}">${g.nome}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(g.valor / max * 100).toFixed(1)}%"></div></div>
        <div class="bar-value">${fmt(g.valor)}</div>
      `;
      barrasEl.appendChild(row);
    });
  }

  function renderDonut(doMes) {
    const ess = doMes.filter(g => g.essencial).reduce((s, g) => s + g.valor, 0);
    const nao = doMes.filter(g => !g.essencial).reduce((s, g) => s + g.valor, 0);
    const total = ess + nao;
    if (total === 0) {
      donutEl.innerHTML = '<div class="empty">Sem dados ainda</div>';
      return;
    }
    const r = 52, c = 2 * Math.PI * r;
    const fracEss = ess / total;
    donutEl.innerHTML = `
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="#7c5cff" stroke-width="20"
          stroke-dasharray="${c}" stroke-dashoffset="0" transform="rotate(-90 70 70)"/>
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="#ffb648" stroke-width="20"
          stroke-dasharray="${(fracEss * c).toFixed(2)} ${c}" transform="rotate(-90 70 70)"
          stroke-linecap="${fracEss > 0 && fracEss < 1 ? 'butt' : 'butt'}"/>
        <text x="70" y="64" text-anchor="middle" class="donut-center-text">essencial</text>
        <text x="70" y="82" text-anchor="middle" class="donut-center-num">${Math.round(fracEss * 100)}%</text>
      </svg>
      <div class="legend">
        <div class="item"><span class="dot" style="background:#ffb648"></span> Essencial <span class="val">${fmt(ess)}</span></div>
        <div class="item"><span class="dot" style="background:#7c5cff"></span> Não essencial <span class="val">${fmt(nao)}</span></div>
      </div>
    `;
  }

  function render() {
    lista.innerHTML = '';
    mesAtualEl.textContent = MESES[visao.mes] + (visao.ano !== hoje.getFullYear() ? ' ' + visao.ano : '');
    renderTabs();
    const doMes = gastosDoMes();

    const totalMes = doMes.reduce((s, g) => s + g.valor, 0);
    totalEl.textContent = fmt(totalMes);

    const saldoMes = saldos[chaveVisao()];
    if (saldoMes !== undefined) {
      saldoEl.textContent = fmt(saldoMes);
      const restante = saldoMes - totalMes;
      restanteEl.textContent = fmt(restante);
      restanteEl.className = 'value ' + (restante >= 0 ? 'positivo' : 'negativo');
    } else {
      saldoEl.textContent = '—';
      restanteEl.textContent = '—';
      restanteEl.className = 'value';
    }

    const restTotalEl = document.getElementById('restante-total');
    const rt = restanteTotal();
    if (rt !== null) {
      restTotalEl.textContent = fmt(rt);
      restTotalEl.className = 'value ' + (rt >= 0 ? 'positivo' : 'negativo');
    } else {
      restTotalEl.textContent = '—';
      restTotalEl.className = 'value';
    }

    renderBarras(doMes);
    renderDonut(doMes);

    if (doMes.length === 0) {
      lista.innerHTML = '<div class="empty">Nenhum gasto neste mês. 🚀</div>';
      return;
    }

    [...doMes].reverse().forEach(g => {
      const div = document.createElement('div');
      div.className = 'gasto' + (g.essencial ? ' essencial' : '');
      const data = new Date(g.data).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
      const emEdicao = editandoId === g.id;
      if (emEdicao) {
        div.innerHTML = `
          <div class="icon">${g.nome.charAt(0).toUpperCase()}</div>
          <div class="info edicao">
            <input class="nome-input" type="text" value="${g.nome.replace(/"/g, '&quot;')}">
            <label class="check-edit"><input type="checkbox" class="ess-input" ${g.essencial ? 'checked' : ''}> Essencial</label>
            <label class="check-edit fixo"><input type="checkbox" class="fixo-input" ${g.fixo ? 'checked' : ''}> Fixo</label>
          </div>
          <input class="preco-input" type="text" inputmode="decimal" value="${String(g.valor.toFixed(2)).replace('.', ',')}">
          <button class="act edit" title="Salvar">💾</button>
          <button class="act del" title="Remover">✕</button>
        `;
        const nomeIn = div.querySelector('.nome-input');
        const precoIn = div.querySelector('.preco-input');
        setTimeout(() => { precoIn.focus(); precoIn.select(); }, 0);
        const confirmar = () => {
          const novoNome = nomeIn.value.trim();
          const novoValor = parseValor(precoIn.value);
          if (novoNome) g.nome = novoNome;
          if (novoValor > 0) g.valor = novoValor;
          g.essencial = div.querySelector('.ess-input').checked;
          g.fixo = div.querySelector('.fixo-input').checked;
          editandoId = null;
          salvar();
        };
        div.querySelector('.edit').addEventListener('click', confirmar);
        [nomeIn, precoIn].forEach(inp => inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') confirmar();
          if (e.key === 'Escape') { editandoId = null; render(); }
        }));
      } else {
        div.innerHTML = `
          <div class="icon">${g.nome.charAt(0).toUpperCase()}</div>
          <div class="info">
            <div class="nome">${g.nome}${g.essencial ? '<span class="badge">essencial</span>' : ''}${g.fixo ? '<span class="badge fixo-badge">fixo</span>' : ''}</div>
            <div class="data">${data}</div>
          </div>
          <div class="preco">${fmt(g.valor)}</div>
          <button class="act edit" title="Editar">✏️</button>
          <button class="act del" title="Remover">✕</button>
        `;
        div.querySelector('.edit').addEventListener('click', () => { editandoId = g.id; render(); });
      }

      div.querySelector('.del').addEventListener('click', () => {
        gastos = gastos.filter(x => x.id !== g.id);
        if (editandoId === g.id) editandoId = null;
        salvar();
      });
      lista.appendChild(div);
    });
  }

  function salvar() {
    localStorage.setItem('gastos', JSON.stringify(gastos));
    render();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const nome = nomeInput.value.trim();
    const valor = parseValor(valorInput.value);
    if (!nome || !(valor > 0)) {
      valorInput.style.borderColor = 'var(--danger)';
      setTimeout(() => valorInput.style.borderColor = '', 1200);
      return;
    }
    gastos.push({ id: Date.now(), nome, valor, essencial: essencialInput.checked, fixo: fixoInput.checked, data: new Date().toISOString() });
    salvar();
    form.reset();
    nomeInput.focus();
  });

  render();
</script>
</body>
</html>
